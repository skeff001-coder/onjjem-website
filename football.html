<div id="app"></div>
<script>
// Kids' town football shirts: town name in team colours + child's name and number.
// No club names, crests, nicknames or official fonts.
const FT = {
  PRE:  { town: "PRESTON",    shirt: "#ffffff", text: "#1b2a4a", line: null,      sw: "White" },
  LIV:  { town: "LIVERPOOL",  shirt: "#c8102e", text: "#ffffff", line: null,      sw: "Red" },
  MANR: { town: "MANCHESTER", shirt: "#c8102e", text: "#ffffff", line: null,      sw: "Red" },
  MANB: { town: "MANCHESTER", shirt: "#8fc3ea", text: "#ffffff", line: "#1b2a4a", sw: "Light blue" },
  NEW:  { town: "NEWCASTLE",  shirt: "#ffffff", text: "#111111", line: "#d4af37", sw: "White", stripes: ["#111111", "#ffffff"] },
  BIR:  { town: "BIRMINGHAM", shirt: "#2a4fb0", text: "#ffffff", line: null,      sw: "Royal blue" },
  LEE:  { town: "LEEDS",      shirt: "#ffffff", text: "#f6c200", line: "#1d428a", sw: "White" },
  SHE:  { town: "SHEFFIELD",  shirt: "#ffffff", text: "#c8102e", line: "#111111", sw: "White", stripes: ["#c8102e", "#ffffff"] },
  LEI:  { town: "LEICESTER",  shirt: "#2a4fb0", text: "#ffffff", line: "#d4af37", sw: "Royal blue" },
  NOT:  { town: "NOTTINGHAM", shirt: "#c8102e", text: "#ffffff", line: null,      sw: "Red" }
};
const SIZES = [["3Y", "3–4 years"], ["5Y", "5–6 years"], ["7Y", "7–8 years"], ["9Y", "9–11 years"], ["12Y", "12–13 years"]];
const NAMES = { PRE: "Preston", LIV: "Liverpool", MANR: "Manchester (red)", MANB: "Manchester (sky blue)", NEW: "Newcastle", BIR: "Birmingham", LEE: "Leeds", SHE: "Sheffield", LEI: "Leicester", NOT: "Nottingham" };

function ftBall(ctx, x, y, r) {
  ctx.save(); ctx.translate(x, y);
  ctx.fillStyle = "#fff"; ctx.strokeStyle = "#111"; ctx.lineWidth = r * 0.07;
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  const pent = (cx, cy, s, rot) => { ctx.beginPath(); for (let i = 0; i < 5; i++) { const a = rot + i * 2 * Math.PI / 5; ctx[i ? "lineTo" : "moveTo"](cx + s * Math.cos(a), cy + s * Math.sin(a)); } ctx.closePath(); ctx.fillStyle = "#111"; ctx.fill(); };
  pent(0, 0, r * 0.36, -Math.PI / 2);
  for (let i = 0; i < 5; i++) { const a = -Math.PI / 2 + i * 2 * Math.PI / 5; ctx.beginPath(); ctx.moveTo(r * 0.36 * Math.cos(a), r * 0.36 * Math.sin(a)); ctx.lineTo(r * 0.78 * Math.cos(a), r * 0.78 * Math.sin(a)); ctx.stroke(); ctx.save(); ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.clip(); pent(r * 0.98 * Math.cos(a), r * 0.98 * Math.sin(a), r * 0.3, a + Math.PI / 5 + Math.PI); ctx.restore(); }
  // motion lines
  ctx.strokeStyle = "rgba(0,0,0,0)"; ctx.restore();
}
function ftFit(ctx, text, font, max, start) { let s = start; do { ctx.font = font.replace("{px}", s); s -= 6; } while (ctx.measureText(text).width > max && s > 20); return s + 6; }
function ftText(ctx, t, x, y, fill, line, lw) { if (line) { ctx.lineJoin = "round"; ctx.lineWidth = lw; ctx.strokeStyle = line; ctx.strokeText(t, x, y); } ctx.fillStyle = fill; ctx.fillText(t, x, y); }

function ftDraw(code, name, num) {
  const c = FT[code], W = 2400, H = 2700;
  const cv = document.createElement("canvas"); cv.width = W; cv.height = H;
  const ctx = cv.getContext("2d"); ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
  const font = "{px}px Graduate, 'Arial Black', sans-serif";
  const tsize = ftFit(ctx, c.town, font, 2250, 400);
  ctx.font = font.replace("{px}", tsize);
  ftText(ctx, c.town, W / 2, 420, c.text, c.line, tsize * 0.09);
  if (c.stripes) { const bw = 120, n = 12, x0 = W / 2 - n * bw / 2; for (let i = 0; i < n; i++) { ctx.fillStyle = c.stripes[i % 2]; ctx.fillRect(x0 + i * bw, 500, bw, 70); } ctx.strokeStyle = c.stripes[0]; ctx.lineWidth = 8; ctx.strokeRect(x0, 500, n * bw, 70); }
  ftBall(ctx, W / 2, 980, 300);
  // speed lines
  ctx.strokeStyle = c.line || c.text; ctx.lineWidth = 26; ctx.lineCap = "round";
  [[-520, -80, -380], [-560, 20, -400], [-500, 120, -360]].forEach(([a, dy, b]) => { ctx.beginPath(); ctx.moveTo(W / 2 + a, 980 + dy); ctx.lineTo(W / 2 + b, 980 + dy); ctx.stroke(); });
  const nm = (name || "").trim().toUpperCase();
  if (nm) { const s = ftFit(ctx, nm, "{px}px Oswald, Impact, sans-serif", 2000, 330); ctx.font = `${s}px Oswald, Impact, sans-serif`; ftText(ctx, nm, W / 2, 1640, c.text, c.line, s * 0.08); }
  if (num !== "" && num != null) { ctx.font = "1000px Oswald, Impact, sans-serif"; ftText(ctx, String(num), W / 2, nm ? 2620 : 2300, c.text, c.line, 70); }
  return cv.toDataURL("image/png");
}

const MAKER = `
  <div class="ft-maker">
    <label for="ftName">Their name <span style="color:var(--muted);font-weight:400">(up to 12 letters)</span></label>
    <input id="ftName" maxlength="12" autocomplete="off" placeholder="e.g. OLIVER" style="text-transform:uppercase">
    <label for="ftNum">Their number <span style="color:var(--muted);font-weight:400">(0–99)</span></label>
    <input id="ftNum" inputmode="numeric" maxlength="2" placeholder="e.g. 9">
    <p class="ft-note">ONJJEM prints personalised names and numbers for fans. To comply with legal and image rights guidelines, we cannot print active professional player names or official club trademarks on custom orders.</p>
  </div>`;

window.PAGE = {
  kicker: "⚽ Kids' football shirts",
  title: "Your town's colours, their name and number",
  sub: "A football T-shirt for little fans: your town's name in its football colours, with their own name and squad number. Pick the town, type the name, done.",
  heroImg: "/football-hero.jpg",
  heroAlt: "Three kids' football T-shirts with town names, a football and a name and number",
  ticks: ["10 towns in their football colours", "Their own name and number", "Soft cotton kids' tee, ages 3–13", "Made in the UK, free UK delivery"],
  cta: "Make their shirt",
  stickyCta: "Make their shirt",
  optionWord: "your town",
  orderTitle: "Make their football shirt",
  variantWord: "the T-shirt",
  photoLabel: "Their name & number",
  designsOnly: true,
  photoFirst: false,
  makerHtml: MAKER,
  pngMaxPx: 2400,
  needPhotoMsg: "Pick a size first, then type their name 🙂",
  options: Object.keys(FT).map((k, i) => ({
    sku: `FTEE-${k}-7Y`, ratio: [8, 9], name: NAMES[k] + " football tee", note: FT[k].sw + " shirt", price: 15.99,
    skuPattern: `FTEE-${k}-{size}{colour}`, sizes: SIZES, colours: [["", FT[k].sw, FT[k].shirt]], ...(i === 0 ? { default: true } : {})
  })),
  onOption: () => ftRefresh(),
  faq: [
    ["Is this an official club shirt?", "No. These are our own town designs: the town's name in its football colours with a generic football. They are not official, licensed or connected to any football club."],
    ["Can I put a footballer's name on it?", "We can't print active professional players' names, club names, badges or nicknames. Your child's own name and number are perfect."],
    ["What sizes are there?", "Kids' sizes from 3–4 years up to 12–13 years. It's a classic cotton tee: if they're between sizes, go up one."],
    ["How long does it take?", "Made to order in the UK in 1–3 days, then posted free."],
    ["What if something's wrong?", "Email hello@onjjem.com with a photo and we'll put it right with a free replacement."]
  ]
};
let ftTimer;
async function ftRefresh() {
  const o = window.ONJJEM_currentOption ? window.ONJJEM_currentOption() : window.PAGE.options[0];
  const code = o.sku.split("-")[1];
  const nameEl = document.getElementById("ftName"), numEl = document.getElementById("ftNum");
  if (!nameEl) return;
  nameEl.value = nameEl.value.toUpperCase().replace(/[^A-Z '\-.]/g, "");
  numEl.value = numEl.value.replace(/\D/g, "").slice(0, 2);
  try { await document.fonts.load("200px Graduate"); await document.fonts.load("200px Oswald"); } catch (e) {}
  if (window.ONJJEM_setDesign) await window.ONJJEM_setDesign(ftDraw(code, nameEl.value, numEl.value));
}
document.addEventListener("input", e => { if (e.target && (e.target.id === "ftName" || e.target.id === "ftNum")) { clearTimeout(ftTimer); ftTimer = setTimeout(ftRefresh, 300); } });
window.addEventListener("load", () => setTimeout(ftRefresh, 300));
</script>
