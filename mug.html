<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChromaCoat Magic Mug — ONJJEM</title>
<meta name="description" content="Upload your photo and get it printed on our heat-activated colour-changing mug. Apple Pay, Google Pay, and card — one tap checkout.">
<script src="https://js.stripe.com/v3/"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #0A0804;
    color: #F5EDD8;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding-bottom: 40px;
  }
  .wrap { max-width: 420px; margin: 0 auto; padding: 20px 16px; }
  .brand { text-align: center; font-size: 18px; font-weight: 900; color: #F3D078; letter-spacing: 1px; margin-bottom: 4px; }
  h1 { text-align: center; font-size: 22px; font-weight: 800; color: #FFFFFF; margin: 4px 0 4px; }
  .sub { text-align: center; color: rgba(245,237,216,0.65); font-size: 13px; margin-bottom: 16px; }

  .hero-img { width: 100%; border-radius: 16px; margin-bottom: 16px; }

  .price-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-top: 1px solid rgba(184,137,42,0.2);
    border-bottom: 1px solid rgba(184,137,42,0.2);
    padding: 14px 0;
    margin-bottom: 16px;
  }
  .price-now { font-size: 28px; font-weight: 900; color: #FFFFFF; }
  .free-ship-pill {
    background: rgba(57,255,136,0.15);
    color: #39FF88;
    font-size: 11px;
    font-weight: 800;
    text-transform: uppercase;
    padding: 5px 10px;
    border-radius: 20px;
  }

  /* Express Checkout renders here — Apple Pay / Google Pay / Link,
     above the fold, before any manual form fields */
  #express-checkout-element { margin-bottom: 16px; min-height: 44px; }
  .express-divider {
    text-align: center;
    font-size: 12px;
    color: rgba(245,237,216,0.4);
    margin: 4px 0 16px;
  }

  .upload-box {
    background: rgba(184,137,42,0.08);
    border: 2px dashed rgba(184,137,42,0.4);
    border-radius: 16px;
    padding: 28px 16px;
    text-align: center;
    cursor: pointer;
    margin-bottom: 16px;
  }
  .upload-box svg { width: 36px; height: 36px; margin-bottom: 8px; color: #D4B14A; }
  .upload-box .main-text { font-size: 15px; font-weight: 800; color: #F3E9D6; }
  .upload-box .sub-text { font-size: 12px; color: rgba(245,237,216,0.5); margin-top: 4px; }
  #photoInput { display: none; }
  #photoPreview { display: none; max-width: 100%; max-height: 200px; border-radius: 12px; margin-bottom: 8px; }

  .status { font-size: 13px; text-align: center; min-height: 18px; margin-top: 6px; }
  .status.error { color: #E8A05C; }

  .buy-btn {
    width: 100%;
    background: linear-gradient(135deg,#B8892A,#D4B14A,#F3E2BC,#B8892A);
    color: #1A1206;
    font-size: 17px;
    font-weight: 900;
    padding: 16px;
    border-radius: 14px;
    border: none;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }
  .buy-btn:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>

  <div class="wrap">
    <div class="brand">ONJJEM</div>
    <h1>ChromaCoat Magic Mug</h1>
    <p class="sub">Looks plain black — reveals your photo in full colour with hot drinks</p>

    <img class="hero-img" src="/products/magic-mug-final.png" alt="ChromaCoat colour-changing mug">

    <div class="price-row">
      <div class="price-now">£17.99</div>
      <span class="free-ship-pill">Free UK Shipping</span>
    </div>

    <!-- Stripe Express Checkout — Apple Pay / Google Pay / Link.
         Only shows up if the customer's device/browser actually
         supports one of these — otherwise this whole block stays
         empty and they just use the normal upload+buy flow below. -->
    <div id="express-checkout-element"></div>
    <p class="express-divider" id="expressDivider" style="display:none;">or pay with card below</p>

    <div class="upload-box" id="uploadBox" onclick="document.getElementById('photoInput').click()">
      <svg id="uploadIcon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 002-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
      <img id="photoPreview" alt="Your uploaded photo">
      <div class="main-text" id="uploadMainText">Tap to Upload Your Photo</div>
      <div class="sub-text" id="uploadSubText">Accepts JPG or PNG from your camera roll</div>
    </div>
    <input type="file" id="photoInput" accept="image/*">
    <p class="status" id="fileStatus"></p>

    <label for="postcodeInput" style="display:block; font-size:13px; font-weight:700; color:#F3E9D6; margin-bottom:6px;">Your postcode (for delivery cost)</label>
    <input type="text" id="postcodeInput" placeholder="e.g. SW1A 1AA" style="width:100%; padding:12px 14px; border-radius:10px; border:1px solid rgba(184,137,42,0.4); background:rgba(255,255,255,0.06); color:#F5EDD8; font-size:15px; margin-bottom:16px;">

    <button class="buy-btn" id="buyBtn" disabled onclick="startCheckout()">Buy Now — £17.99</button>
    <p class="status" id="checkoutStatus"></p>
  </div>

<script>
const API_BASE = "https://onjjem-production-5ef8.up.railway.app";
const SKU = "magic-mug";
let photoBase64 = null;
let stripe = null;

function toBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

document.getElementById("photoInput").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  const fileStatus = document.getElementById("fileStatus");
  const buyBtn = document.getElementById("buyBtn");
  if (!file) return;
  fileStatus.textContent = "Loading your photo...";
  try {
    photoBase64 = await toBase64(file);
    document.getElementById("photoPreview").src = photoBase64;
    document.getElementById("photoPreview").style.display = "block";
    document.getElementById("uploadIcon").style.display = "none";
    document.getElementById("uploadMainText").textContent = "✅ Photo added — tap to change";
    document.getElementById("uploadSubText").textContent = file.name;
    fileStatus.textContent = "";
    buyBtn.disabled = false;
  } catch (err) {
    fileStatus.textContent = "Could not read that photo. Please try again.";
  }
});

async function startCheckout() {
  const buyBtn = document.getElementById("buyBtn");
  const status = document.getElementById("checkoutStatus");

  if (!photoBase64) {
    status.textContent = "Please upload a photo first.";
    return;
  }

  const postcode = document.getElementById("postcodeInput").value.trim();
  if (!postcode) {
    status.textContent = "Please enter your postcode above to continue.";
    return;
  }
  const isInternational = !/^[A-Za-z]{1,2}\d/.test(postcode);

  buyBtn.disabled = true;
  status.textContent = "Preparing checkout...";

  try {
    const res = await fetch(`${API_BASE}/api/stripe/checkout`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        sku: SKU,
        photoBase64,
        international: isInternational,
        successUrl: window.location.origin + "/?order=success",
        cancelUrl: window.location.href,
      }),
    });
    const data = await res.json();
    if (data.url) {
      window.location.href = data.url;
    } else {
      throw new Error(data.error || "Could not start checkout");
    }
  } catch (err) {
    status.textContent = "Something went wrong — please try again.";
    buyBtn.disabled = false;
  }
}

// ── Stripe Express Checkout (Apple Pay / Google Pay / Link) ─────────────────
// This requires a photo to already be uploaded before it can charge — so we
// only mount it once a photo exists, and it reuses the exact same backend
// endpoint as the normal Buy button, just skipping the extra tap.
(async function setupExpressCheckout() {
  try {
    const configRes = await fetch(`${API_BASE}/api/stripe/config`);
    const config = await configRes.json();
    if (!config.publishableKey) return;

    stripe = Stripe(config.publishableKey);

    const elements = stripe.elements({
      mode: "payment",
      amount: 1799,
      currency: "gbp",
    });

    const expressCheckoutElement = elements.create("expressCheckout");
    expressCheckoutElement.mount("#express-checkout-element");

    expressCheckoutElement.on("ready", ({ availablePaymentMethods }) => {
      if (availablePaymentMethods) {
        document.getElementById("expressDivider").style.display = "block";
      }
    });

    expressCheckoutElement.on("confirm", async () => {
      if (!photoBase64) {
        alert("Please upload your photo first, then use Apple Pay / Google Pay.");
        return;
      }
      const postcode = document.getElementById("postcodeInput").value.trim();
      if (!postcode) {
        alert("Please enter your postcode above first, then use Apple Pay / Google Pay.");
        return;
      }
      const isInternational = !/^[A-Za-z]{1,2}\d/.test(postcode);

      try {
        const res = await fetch(`${API_BASE}/api/stripe/checkout`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            sku: SKU,
            photoBase64,
            international: isInternational,
            successUrl: window.location.origin + "/?order=success",
            cancelUrl: window.location.href,
          }),
        });
        const data = await res.json();
        if (data.url) {
          window.location.href = data.url;
        }
      } catch (err) {
        alert("Something went wrong — please try again.");
      }
    });
  } catch (err) {
    // If this fails for any reason, the page still works fine via the
    // normal Buy Now button below — Express Checkout is a bonus, not a
    // requirement.
    console.log("Express Checkout unavailable:", err);
  }
})();
</script>
</body>
</html>
