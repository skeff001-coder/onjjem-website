// Thank-you message + Google Analytics purchase after a Stripe checkout
(function () {
  var q = new URLSearchParams(location.search);
  if (q.get("order") !== "success") return;
  var box = document.getElementById("success");
  box.style.display = "block";
  var sid = q.get("session_id");
  if (!sid || sid.indexOf("{") === 0) return;
  var key = "onjjem_ga_" + sid;
  try { if (sessionStorage.getItem(key)) return; } catch (e) {}
  fetch(API_BASE + "/api/stripe/session/" + encodeURIComponent(sid))
    .then(function (r) { return r.json(); })
    .then(function (s) {
      if (!s || !s.id) return;
      var items = ((s.line_items && s.line_items.data) || []).map(function (li) {
        return { item_name: li.price && li.price.product && li.price.product.name, price: (li.price && li.price.unit_amount || 0) / 100, quantity: li.quantity || 1 };
      });
      onjjemGa("event", "purchase", { transaction_id: s.id, currency: (s.currency || "gbp").toUpperCase(), value: (s.amount_total || 0) / 100, items: items });
      try { sessionStorage.setItem(key, "1"); } catch (e) {}
    }).catch(function () {});
})();

</script>
