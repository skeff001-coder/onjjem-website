<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cartoon Kids Zone | ONJJEM</title>
<meta name="description" content="Custom cartoon t-shirts, jigsaws, playing cards and more for kids. Free UK shipping.">
<link rel="canonical" href="https://onjjem.com/kids" />
<script async src="https://www.googletagmanager.com/gtag/js?id=G-3L30Q5L3MW"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-3L30Q5L3MW');
</script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#2a2a2a; color:#fff; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; }
  .header { background:#3a3a3a; padding:1.2rem 1.5rem; border-bottom:2px solid #d4af37; display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; z-index:100; }
  .logo { font-size:1.5rem; font-weight:700; color:#d4af37; text-decoration:none; letter-spacing:2px; }
  .nav { display:flex; gap:1.5rem; }
  .nav a { color:#fff; text-decoration:none; font-weight:500; font-size:0.9rem; }
  .nav a:hover { color:#d4af37; }
  .page-header { text-align:center; padding:2.5rem 1.5rem 1.5rem; }
  .page-header h1 { color:#d4af37; font-size:2rem; margin-bottom:0.5rem; }
  .page-header p { color:#ccc; max-width:600px; margin:0 auto; }
  .products { max-width:1100px; margin:0 auto; padding:1rem 1.5rem 3rem; display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:1.5rem; }
  .card { background:#fff; border-radius:10px; overflow:hidden; }
  .card img { width:100%; height:200px; object-fit:cover; display:block; background:#eee; }
  .card-body { padding:1.2rem; }
  .card h3 { color:#1a1a1a; font-size:1.1rem; margin-bottom:0.3rem; }
  .card .price { color:#b8892a; font-weight:700; margin-bottom:0.6rem; }
  .card .desc { color:#666; font-size:0.85rem; line-height:1.5; margin-bottom:1rem; }
  select.variant { width:100%; padding:0.6rem; border-radius:6px; border:1px solid #ccc; margin-bottom:0.8rem; font-size:0.85rem; }
  input[type=file] { width:100%; font-size:0.8rem; margin-bottom:0.8rem; }
  .buy-btn { display:block; width:100%; background:#d4af37; color:#1a1a1a; font-weight:700; padding:0.8rem; border:none; border-radius:6px; cursor:pointer; }
  .buy-btn:hover { background:#e5c158; }
  .buy-btn:disabled { opacity:0.5; cursor:not-allowed; }
  .status { font-size:0.8rem; margin-top:0.5rem; min-height:14px; text-align:center; }
  footer { text-align:center; padding:2rem; color:#999; border-top:1px solid #444; font-size:0.85rem; }
  footer a { color:#d4af37; text-decoration:none; margin:0 8px; }
</style>
</head>
<body>

<header class="header">
  <a href="/" class="logo">ONJJEM</a>
  <nav class="nav">
    <a href="/">Home</a>
    <a href="/#help">Help</a>
    <a href="/gift-cards.html">Gift Cards</a>
  </nav>
</header>

<div class="page-header">
  <h1>Cartoon Kids Zone</h1>
  <p>Transform any photo into a playful cartoon illustration. Custom t-shirts, jigsaws, playing cards & more.</p>
</div>

<div class="products" id="products"></div>

<footer>
  <a href="/delivery.html">Delivery Info</a>
  <a href="/terms.html">Terms</a>
  <a href="/privacy.html">Privacy</a>
</footer>

<script>
const API_BASE = "https://onjjem-production-5ef8.up.railway.app";

const ITEMS = [

  {
    name: "Kids Cartoon T-Shirt",
    img: "/products/girl-tshirt.jpg",
    desc: "Premium kids' cartoon t-shirt (Stanley/Stella STTK184). Your photo transforms into a playful cartoon illustration, printed large on the front. 6 colours, 5 sizes (3-14 years).",
    variants: [
      { sku: "TEE-STTK184-3Y-WHITE", label: "3-4Y / White - £16.99" },
      { sku: "TEE-STTK184-3Y-BLACK", label: "3-4Y / Black - £16.99" },
      { sku: "TEE-STTK184-3Y-HEATHER", label: "3-4Y / Heather Grey - £16.99" },
      { sku: "TEE-STTK184-5Y-WHITE", label: "5-6Y / White - £16.99" },
      { sku: "TEE-STTK184-5Y-BLACK", label: "5-6Y / Black - £16.99" },
      { sku: "TEE-STTK184-5Y-HEATHER", label: "5-6Y / Heather Grey - £16.99" },
      { sku: "TEE-STTK184-7Y-WHITE", label: "7-8Y / White - £16.99" },
      { sku: "TEE-STTK184-7Y-BLACK", label: "7-8Y / Black - £16.99" },
      { sku: "TEE-STTK184-7Y-HEATHER", label: "7-8Y / Heather Grey - £16.99" },
      { sku: "TEE-STTK184-9Y-WHITE", label: "9-11Y / White - £16.99" },
      { sku: "TEE-STTK184-9Y-BLACK", label: "9-11Y / Black - £16.99" },
      { sku: "TEE-STTK184-9Y-HEATHER", label: "9-11Y / Heather Grey - £16.99" },
      { sku: "TEE-STTK184-12Y-WHITE", label: "12-14Y / White - £16.99" },
      { sku: "TEE-STTK184-12Y-BLACK", label: "12-14Y / Black - £16.99" },
      { sku: "TEE-STTK184-12Y-HEATHER", label: "12-14Y / Heather Grey - £16.99" }
    ]
  },
  {
    name: "The Kids' Corner Jigsaw",
    img: "/products/jigsaw-500pc.webp",
    desc: "A playful jigsaw puzzle perfect for hands-on fun. Your photo gets the fun cartoon treatment before being puzzle-cut. Choose the size that suits.",
    variants: [
      { sku: "jigsaw-30", label: "30 pieces (Pocket Masterpiece) - £21.99" },
      { sku: "jigsaw-110", label: "110 pieces (The Perfect Gift) - £24.99" },
      { sku: "jigsaw-252", label: "252 pieces (The Rainy Day Choice) - £27.99" },
      { sku: "jigsaw-500", label: "500 pieces (The Weekend Challenge) - £29.99" },
      { sku: "jigsaw-1000", label: "1000 pieces (The Ultimate Puzzle) - £34.99" }
    ]
  },
  {
    name: "Custom Playing Cards",
    img: "/products/Cards.png",
    desc: "Deck of 54 full-colour playing cards, each card feature a different version of your photo. Great for card games, or a deck to keep as a memory.",
    variants: [
      { sku: "playing-cards", label: "Standard Deck - £16.99" }
    ]
  }
];

const grid = document.getElementById("products");
window.__items = {};

ITEMS.forEach((item, i) => {
  window.__items[i] = item;
  const showDropdown = item.variants.length > 1;
  const options = item.variants.map(v => `<option value="${v.sku}">${v.label}</option>`).join("");
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `
    <img src="${item.img}" alt="${item.name}" loading="lazy">
    <div class="card-body">
      <h3>${item.name}</h3>
      ${showDropdown ? `<select class="variant" data-item="${i}">${options}</select>` : `<p class="price">${item.variants[0].label}</p>`}
      <p class="desc">${item.desc}</p>
      <input type="file" accept="image/*" data-item="${i}" style="display:none;">
      <button class="buy-btn" style="background:#8e7cc3; margin-bottom:0.5rem;" data-item="${i}" data-type="upload">📸 Pick your pic and click</button>
      <div style="display:none; margin-bottom:0.8rem;" data-role="cartoon-box" data-item="${i}">
        <label style="font-size:0.85rem; color:#333; display:flex; align-items:center; gap:6px;">
          <input type="checkbox" data-role="cartoon-checkbox" data-item="${i}">
          ✨ Add Cartoon Transformation +£1.99
        </label>
        <div style="display:none; margin-top:0.5rem; text-align:center;" data-role="preview-wrap" data-item="${i}">
          <img data-role="preview-img" data-item="${i}" style="max-width:100%; border-radius:8px;" alt="Cartoon preview">
        </div>
        <p class="status" data-role="cartoon-status" data-item="${i}"></p>
      </div>
      <button class="buy-btn" data-item="${i}" data-type="checkout" style="display:none;">Buy Now</button>
      <p class="status" data-status="${i}"></p>
    </div>
  `;
  grid.appendChild(card);
});

let photoBase64Map = {};
let confirmedCartoonMap = {};

document.querySelectorAll('input[type="file"]').forEach(input => {
  input.addEventListener("change", async () => {
    const i = input.dataset.item;
    const uploadBtn = document.querySelector(`button[data-item="${i}"][data-type="upload"]`);
    const checkoutBtn = document.querySelector(`button[data-item="${i}"][data-type="checkout"]`);
    const cartoonBox = document.querySelector(`[data-role="cartoon-box"][data-item="${i}"]`);
    const status = document.querySelector(`[data-status="${i}"]`);
    if (input.files.length > 0) {
      photoBase64Map[i] = await toBase64(input.files[0]);
      uploadBtn.style.display = "none";
      checkoutBtn.style.display = "block";
      if (cartoonBox) cartoonBox.style.display = "block";
      status.textContent = "✅ Photo added";
      status.style.color = "#2e7d32";
    }
  });
});

document.querySelectorAll('[data-role="cartoon-checkbox"]').forEach(cb => {
  cb.addEventListener("change", async () => {
    const i = cb.dataset.item;
    const status = document.querySelector(`[data-role="cartoon-status"][data-item="${i}"]`);
    const previewWrap = document.querySelector(`[data-role="preview-wrap"][data-item="${i}"]`);
    const previewImg = document.querySelector(`[data-role="preview-img"][data-item="${i}"]`);

    if (!cb.checked) {
      confirmedCartoonMap[i] = null;
      status.textContent = "";
      previewWrap.style.display = "none";
      return;
    }
    if (!photoBase64Map[i]) {
      status.textContent = "Please pick a photo first.";
      cb.checked = false;
      return;
    }
    status.textContent = "Generating your free cartoon preview...";
    status.style.color = "#666";
    try {
      const mimeMatch = photoBase64Map[i].match(/^data:([^;]+);/);
      const mimeType = mimeMatch ? mimeMatch[1] : "image/jpeg";
      const res = await fetch(`${API_BASE}/api/cartoonify`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ base64Image: photoBase64Map[i], mimeType, watermark: true }),
      });
      const data = await res.json();
      if (data.alreadyUsed) {
        status.textContent = "You've used your free preview — the cartoon will still be added at checkout.";
        confirmedCartoonMap[i] = "PENDING";
        return;
      }
      if (!res.ok || !data.base64Image) throw new Error(data.error || "Could not generate preview");
      previewImg.src = `data:${data.mimeType};base64,${data.base64Image}`;
      previewWrap.style.display = "block";
      status.textContent = "✅ Here's your free preview! Love it? Tap Buy Now below.";
      status.style.color = "#2e7d32";
    } catch (err) {
      status.textContent = "Couldn't generate a preview — the cartoon will still be added at checkout.";
      confirmedCartoonMap[i] = "PENDING";
    }
  });
});

document.querySelectorAll('button[data-type="upload"]').forEach(btn => {
  btn.addEventListener("click", () => {
    const i = btn.dataset.item;
    const fileInput = document.querySelector(`input[type="file"][data-item="${i}"]`);
    fileInput.click();
  });
});

function toBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

document.querySelectorAll('button[data-type="checkout"]').forEach(btn => {
  btn.addEventListener("click", async () => {
    const i = btn.dataset.item;
    const item = window.__items[i];
    const select = document.querySelector(`select[data-item="${i}"]`);
    const sku = select ? select.value : item.variants[0].sku;
    const status = document.querySelector(`[data-status="${i}"]`);
    const photoBase64 = photoBase64Map[i];
    if (!photoBase64) { status.textContent = "Please choose a photo first"; return; }

    const cartoonCb = document.querySelector(`[data-role="cartoon-checkbox"][data-item="${i}"]`);
    const addCartoon = cartoonCb ? cartoonCb.checked : false;
    const confirmedCartoonBase64 = confirmedCartoonMap[i];

    btn.disabled = true;
    status.textContent = "Preparing checkout...";

    try {
      const res = await fetch(`${API_BASE}/api/stripe/checkout`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          sku,
          photoBase64,
          successUrl: window.location.origin + "/?order=success&session_id={CHECKOUT_SESSION_ID}",
          cancelUrl: window.location.href,
          ...(addCartoon ? { addCartoon: true } : {}),
          ...(addCartoon && confirmedCartoonBase64 && confirmedCartoonBase64 !== "PENDING"
            ? { confirmedCartoonBase64 } : {}),
        })
      });
      const data = await res.json();
      if (data.url) window.location.href = data.url;
      else { status.textContent = data.error || "Something went wrong"; btn.disabled = false; }
    } catch (err) {
      status.textContent = "Could not connect. Please try again.";
      btn.disabled = false;
    }
  });
});
</script>
</body>
</html>
