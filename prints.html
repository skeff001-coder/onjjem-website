<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fine Art Prints | ONJJEM</title>
<meta name="description" content="Postcards, canvas prints, metallic foil, glow-in-the-dark posters. Free UK shipping.">
<link rel="canonical" href="https://onjjem.com/prints" />
<script async src="https://www.googletagmanager.com/gtag/js?id=G-3L30Q5L3MK"></script>

<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#2a2a2a; color:#fff; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; }
  .header { background:#3a3a3a; padding:1.2rem 1.5rem; border-bottom:2px solid #d4af37; display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; z-index:100; }
  .logo { font-size:1.5rem; font-weight:700; color:#d4af37; text-decoration:none; letter-spacing:2px; }
  .nav { display:flex; gap:1.5rem; }
  .nav a { color:#fff; text-decoration:none; font-weight:500; font-size:0.9rem; }
  .nav a:hover { color:#d4af37; }
  .page-header { text-align:center; padding:2.5rem 1.5rem 1.5rem; }
  .page-header h1 { color:#d4af37; font-size:2rem; margin-bottom:0.5rem; }
  .page-header p { color:#ccc; max-width:600px; margin:0 auto; }
  .products { max-width:1100px; margin:0 auto; padding:1rem 1.5rem 3rem; display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:1.5rem; }
  .card { background:#fff; border-radius:10px; overflow:hidden; }
  .card img { width:100%; height:200px; object-fit:cover; display:block; background:#eee; }
  .card-body { padding:1.2rem; }
  .card h3 { color:#1a1a1a; font-size:1.1rem; margin-bottom:0.3rem; }
  .card .price { color:#b8892a; font-weight:700; margin-bottom:0.6rem; }
  .card .desc { color:#666; font-size:0.85rem; line-height:1.5; margin-bottom:1rem; }
  select.variant { width:100%; padding:0.6rem; border-radius:6px; border:1px solid #ccc; margin-bottom:0.8rem; font-size:0.85rem; }
  input[type=file] { width:100%; font-size:0.8rem; margin-bottom:0.8rem; }
  .buy-btn { display:block; width:100%; background:#d4af37; color:#1a1a1a; font-weight:700; padding:0.8rem; border:none; border-radius:6px; cursor:pointer; }
  .buy-btn:hover { background:#e5c158; }
  .buy-btn:disabled { opacity:0.5; cursor:not-allowed; }
  .status { font-size:0.8rem; margin-top:0.5rem; min-height:14px; text-align:center; }
  footer { text-align:center; padding:2rem; color:#999; border-top:1px solid #444; font-size:0.85rem; }
  footer a { color:#d4af37; text-decoration:none; margin:0 8px; }
</style>
</head>
<body>

<header class="header">
  <a href="/" class="logo">ONJJEM</a>
  <nav class="nav">
    <a href="/">Home</a>
    <a href="/#help">Help</a>
    <a href="/gift-cards.html">Gift Cards</a>
  </nav>
</header>

<div class="page-header">
  <h1>Fine Art Prints</h1>
  <p>Postcards, canvases, metallic foil, glow-in-the-dark posters & museum-quality prints.</p>
</div>

<div class="products" id="products"></div>

<footer>
  <a href="/delivery.html">Delivery Info</a>
  <a href="/terms.html">Terms</a>
  <a href="/privacy.html">Privacy</a>
</footer>

<script>
const API_BASE = "https://onjjem-production-5ef8.up.railway.app";

const ITEMS = [
  {
    name: "Photo Postcard",
    img: "/products/postcard.jpg",
    desc: "Classic 6x4 inch gloss print. Send through the post or frame. Cartoonify add-on available at checkout.",
    variants: [{ sku: "postcard-6x4-gloss", label: "6x4 Gloss - £2.99" }]
  },
  {
    name: "Museum-Grade Fine Art Print",
    img: "/products/fine-art-print.jpg",
    desc: "Professional Giclée fine art printing on heavyweight 240gsm matte paper with archival, pigment-based inks. Razor-sharp detail, resists fading over time.",
    variants: [
      { sku: "print-5x7", label: "5x7 inch - £5.99" },
      { sku: "print-8x10", label: "8x10 inch - £12.99" },
      { sku: "print-11x14", label: "11x14 inch - £24.99" }
    ]
  },
  {
    name: "Premium Metallic Foil Art Print",
    img: "/products/metallic-foil.jpg",
    desc: "Ultra-heavyweight 350gsm specialist print with true metallic Gold or Silver foil accents. Direct UV digital printing lets you control exactly which lettering or highlights shine.",
    variants: [
      { sku: "foil-a4-gold", label: "A4 / Gold - £25.99" },
      { sku: "foil-a4-silver", label: "A4 / Silver - £25.99" },
      { sku: "foil-a3-gold", label: "A3 / Gold - £39.99" },
      { sku: "foil-a3-silver", label: "A3 / Silver - £39.99" }
    ]
  },
  {
    name: "Eco-Friendly Canvas",
    img: "/products/eco-canvas.jpg",
    desc: "200gsm specialist canvas made from sustainable fibres. Printed with eco-solvent inks. Wrapped around recycled-content frame bars. The responsible premium choice.",
    variants: [
      { sku: "eco-canvas-8x10", label: "8x10 inch - £24.99" },
      { sku: "eco-canvas-12x16", label: "12x16 inch - £39.99" },
      { sku: "eco-canvas-16x20", label: "16x20 inch - £54.99" }
    ]
  },
  {
    name: "Rolled Canvas Print",
    img: "/products/rolled-canvas.jpg",
    desc: "Canvas print rolled (not stretched or framed). Ship flat to save costs. You frame it yourself — or hang with museum wire.",
    variants: [
      { sku: "rolled-canvas-12x16", label: "12x16 inch - £18.99" },
      { sku: "rolled-canvas-16x20", label: "16x20 inch - £24.99" },
      { sku: "rolled-canvas-20x24", label: "20x24 inch - £29.99" }
    ]
  },
  {
    name: "Slim Canvas (Frame & Print Together)",
    img: "/products/slim-canvas.jpg",
    desc: "Canvas print wrapped around ultra-slim (20mm) solid-wood frame bars. Ready to hang straight out of the box. Contemporary, clean look.",
    variants: [
      { sku: "slim-canvas-10x8", label: "10x8 inch - £34.99" },
      { sku: "slim-canvas-16x12", label: "16x12 inch - £54.99" }
    ]
  },
  {
    name: "Glow-in-the-Dark Poster",
    img: "/products/glow-poster.jpg",
    desc: "Your photo glows softly in the dark. Printed on premium matte poster paper with photoluminescent inks. Eerie, magical, utterly unique.",
    variants: [
      { sku: "glow-poster-a3", label: "A3 / Glow - £29.99" },
      { sku: "glow-poster-a2", label: "A2 / Glow - £44.99" }
    ]
  },
  {
    name: "Budget Poster Print",
    img: "/products/budget-poster.jpg",
    desc: "Affordable 130gsm gloss poster. Perfect for bold graphics and high-saturation photos. No frame — pin it or tape it up.",
    variants: [
      { sku: "poster-a3", label: "A3 - £7.99" },
      { sku: "poster-a2", label: "A2 - £12.99" }
    ]
  }
];

const grid = document.getElementById("products");
window.__items = {};

ITEMS.forEach((item, i) => {
  window.__items[i] = item;
  const showDropdown = item.variants.length > 1;
  const options = item.variants.map(v => `<option value="${v.sku}">${v.label}</option>`).join("");
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `
    <img src="${item.img}" alt="${item.name}" loading="lazy">
    <div class="card-body">
      <h3>${item.name}</h3>
      ${showDropdown ? `<select class="variant" data-item="${i}">${options}</select>` : `<p class="price">${item.variants[0].label}</p>`}
      <p class="desc">${item.desc}</p>
      <input type="file" accept="image/*" data-item="${i}">
      <button class="buy-btn" data-item="${i}" disabled>📸 Add Your Photo</button>
      <p class="status" data-status="${i}"></p>
    </div>
  `;
  grid.appendChild(card);
});

document.querySelectorAll('input[type="file"]').forEach(input => {
  input.addEventListener("change", () => {
    const i = input.dataset.item;
    const btn = document.querySelector(`.buy-btn[data-item="${i}"]`);
    const status = document.querySelector(`[data-status="${i}"]`);
    if (input.files.length > 0) {
      btn.disabled = false;
      btn.textContent = "Buy Now";
      status.textContent = "✅ Photo added";
      status.style.color = "#2e7d32";
    }
  });
});

function toBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

document.querySelectorAll(".buy-btn").forEach(btn => {
  btn.addEventListener("click", async () => {
    const i = btn.dataset.item;
    const item = window.__items[i];
    const select = document.querySelector(`select[data-item="${i}"]`);
    const sku = select ? select.value : item.variants[0].sku;
    const fileInput = document.querySelector(`input[type="file"][data-item="${i}"]`);
    const status = document.querySelector(`[data-status="${i}"]`);
    const file = fileInput.files[0];
    if (!file) { status.textContent = "Please choose a photo first"; return; }

    btn.disabled = true;
    status.textContent = "Preparing checkout...";

    try {
      const photoBase64 = await toBase64(file);
      const res = await fetch(`${API_BASE}/api/stripe/checkout`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          sku,
          photoBase64,
          successUrl: window.location.origin + "/?order=success&session_id={CHECKOUT_SESSION_ID}",
          cancelUrl: window.location.href
        })
      });
      const data = await res.json();
      if (data.url) window.location.href = data.url;
      else { status.textContent = data.error || "Something went wrong"; btn.disabled = false; }
    } catch (err) {
      status.textContent = "Could not connect. Please try again.";
      btn.disabled = false;
    }
  });
});
</script>
</body>
</html>
