<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fine Art Prints | ONJJEM</title>
  <meta name="description" content="Premium personalised art prints — museum-quality giclée, metallic foil, canvas and glow-in-the-dark posters. Free UK delivery.">
  <link rel="canonical" href="https://www.onjjem.com/prints.html">
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-3L30Q5L3MK"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-3L30Q5L3MK');
  </script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#2a2a2a; color:#fff; font-family:system-ui,sans-serif; }
    .header { background:#3a3a3a; padding:1rem; display:flex; justify-content:space-between; align-items:center; }
    .logo { font-size:1.5rem; font-weight:900; color:#d4af37; }
    .nav { display:flex; gap:1.5rem; }
    .nav a { color:#fff; text-decoration:none; }
    .nav a:hover { color:#d4af37; }
    .container { max-width:900px; margin:0 auto; padding:1rem; }
    .back-link { color:#d4af37; text-decoration:none; margin-bottom:1.5rem; display:inline-block; }
    h1 { margin-bottom:2rem; color:#d4af37; }
    .products-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:2rem; }
    .card { background:#3a3a3a; border-radius:8px; overflow:hidden; }
    .card-img { width:100%; height:200px; background:#555; display:flex; align-items:center; justify-content:center; }
    .card-img img { width:100%; height:100%; object-fit:cover; }
    .card-body { padding:1.5rem; }
    .card-body h3 { margin-bottom:0.5rem; font-size:1.1rem; }
    .card-body p { font-size:0.9rem; line-height:1.5; color:#ccc; margin-bottom:1rem; }
    .price { font-size:1.3rem; color:#d4af37; font-weight:bold; margin-bottom:1rem; }
    .variants { margin:1rem 0; display:flex; flex-direction:column; gap:0.5rem; }
    .variant-btn { background:#555; border:none; color:#fff; padding:0.5rem; border-radius:4px; cursor:pointer; font-size:0.9rem; }
    .variant-btn.active { background:#d4af37; color:#000; }
    .cartoon-option { border:2px dashed #8e7cc3; background:rgba(142,36,170,0.1); border-radius:8px; padding:1rem; margin:1rem 0; }
    .cartoon-option label { display:flex; gap:0.5rem; cursor:pointer; align-items:flex-start; }
    .cartoon-option input[type="checkbox"] { width:20px; height:20px; cursor:pointer; margin-top:2px; }
    .cartoon-text { }
    .cartoon-title { font-weight:bold; color:#d4af37; }
    .cartoon-desc { font-size:0.85rem; color:#aaa; margin-top:0.3rem; }
    .file-input-wrapper { margin:1rem 0; }
    .file-input-wrapper input { display:none; }
    .upload-btn { width:100%; background:#8e7cc3; border:none; color:#fff; padding:0.8rem; border-radius:4px; cursor:pointer; font-weight:bold; margin-bottom:0.5rem; }
    .upload-btn:hover { background:#9b88d4; }
    .buy-btn { width:100%; background:#d4af37; border:none; color:#000; padding:0.8rem; border-radius:4px; cursor:pointer; font-weight:bold; margin-bottom:0.5rem; }
    .buy-btn:hover { background:#e0c158; }
    .buy-btn:disabled { background:#888; cursor:not-allowed; }
    .preview-container { margin:1rem 0; border:2px solid #8e7cc3; border-radius:8px; padding:1rem; display:none; }
    .preview-container.show { display:block; }
    .preview-img { width:100%; border-radius:4px; margin-bottom:0.5rem; }
    .preview-btn { width:48%; padding:0.6rem; border:none; border-radius:4px; cursor:pointer; margin-right:4%; }
    .preview-accept { background:#4caf50; color:#fff; }
    .preview-reject { background:#f44336; color:#fff; }
    .status { font-size:0.9rem; margin-top:0.5rem; min-height:1.2rem; }
    .footer { background:#3a3a3a; padding:2rem; text-align:center; margin-top:3rem; font-size:0.9rem; }
    .footer a { color:#d4af37; text-decoration:none; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">ONJJEM</div>
    <div class="nav">
      <a href="/">Home</a>
      <a href="#help">Help</a>
    </div>
  </div>

  <div class="container">
    <a href="/household.html" class="back-link">← Back to Household</a>
    <h1>🎨 Fine Art Prints</h1>
    <p style="margin-bottom:2rem; color:#ccc;">Postcards, canvases, metallic foil, glow-in-the-dark posters & museum-quality prints.</p>

    <div class="products-grid" id="products"></div>
  </div>

  <div class="footer">
    <p><a href="/delivery.html">Delivery Info</a> | <a href="/terms.html">Terms</a> | <a href="/privacy.html">Privacy</a></p>
  </div>

  <script>
const ITEMS = [
  {
    name: "Photo Postcard",
    desc: "Beautifully printed on premium 350gsm card. Free UK tracked delivery.",
    price: 2.99,
    img: "/products/postcard.jpg",
    variants: [{ label: "Single", sku: "postcard-single" }]
  },
  {
    name: "Museum-Grade Fine Art Print",
    desc: "Professional Giclée printing on heavyweight 240gsm matte paper with archival pigment inks. Museum quality.",
    price: 5.99,
    img: "/products/fine-art-print.jpg",
    variants: [
      { label: "5x7\"", sku: "art-print-5x7", price: 5.99 },
      { label: "8x10\"", sku: "art-print-8x10", price: 9.99 },
      { label: "11x14\"", sku: "art-print-11x14", price: 14.99 },
      { label: "12x16\"", sku: "art-print-12x16", price: 19.99 },
      { label: "24x32\"", sku: "art-print-24x32", price: 32.99 },
      { label: "36x48\"", sku: "art-print-36x48", price: 57.99 }
    ]
  },
  {
    name: "Metallic Foil Premium Print",
    desc: "350gsm premium gold or silver foil base. Stunning metallic finish. Frame not included.",
    price: 7.99,
    img: "/products/metallic-foil.jpg",
    variants: [
      { label: "4x6\" Gold", sku: "ART-FOIL-GOL-4X6", price: 7.99 },
      { label: "4x6\" Silver", sku: "ART-FOIL-SIL-4X6", price: 7.99 },
      { label: "12x12\" Square Gold", sku: "ART-FOIL-GOL-12X12", price: 15.99 },
      { label: "12x12\" Square Silver", sku: "ART-FOIL-SIL-12X12", price: 15.99 },
      { label: "50x70cm Gold", sku: "ART-FOIL-GOL-20X28", price: 15.99 },
      { label: "50x70cm Silver", sku: "ART-FOIL-SIL-20X28", price: 15.99 },
      { label: "A3 Gold", sku: "ART-FOIL-GOL-A3", price: 18.99 },
      { label: "A3 Silver", sku: "ART-FOIL-SIL-A3", price: 18.99 },
      { label: "A2 Gold", sku: "ART-FOIL-GOL-A2", price: 26.99 },
      { label: "A2 Silver", sku: "ART-FOIL-SIL-A2", price: 26.99 }
    ]
  },
  {
    name: "Rolled Canvas Print",
    desc: "Museum-quality canvas on wooden dowel. Vibrant, fade-resistant colours.",
    price: 9.99,
    img: "/products/rolled-canvas.jpg",
    variants: [{ label: "Standard", sku: "canvas-rolled" }]
  },
  {
    name: "Slim Canvas",
    desc: "Lightweight, ready-to-hang canvas with slim frame.",
    price: 14.99,
    img: "/products/slim-canvas.jpg",
    variants: [{ label: "Standard", sku: "canvas-slim" }]
  },
  {
    name: "Eco Canvas",
    desc: "Sustainably printed on eco-friendly canvas.",
    price: 12.99,
    img: "/products/eco-canvas.jpg",
    variants: [{ label: "Standard", sku: "canvas-eco" }]
  },
  {
    name: "Budget Poster",
    desc: "Affordable, vibrant poster print on standard paper.",
    price: 2.99,
    img: "/products/budget-poster.jpg",
    variants: [{ label: "A4", sku: "poster-budget-a4" }]
  },
  {
    name: "Glow-in-the-Dark Poster",
    desc: "Prints that glow under UV light. Amazing for rooms and creative spaces.",
    price: 8.99,
    img: "/products/glow-poster.jpg",
    variants: [{ label: "A3", sku: "poster-glow-a3" }]
  }
];

const container = document.getElementById('products');
let cartoonPreviewData = {};

ITEMS.forEach((item, idx) => {
  const card = document.createElement('div');
  card.className = 'card';

  const variantOptions = item.variants.map(v => 
    `<option value="${v.sku}" data-price="${v.price || item.price}">${v.label}</option>`
  ).join('');

  const hasMultipleVariants = item.variants.length > 1;

  card.innerHTML = `
    <div class="card-img">
      <img src="${item.img}" alt="${item.name}" loading="lazy">
    </div>
    <div class="card-body">
      <h3>${item.name}</h3>
      <p>${item.desc}</p>
      ${hasMultipleVariants ? `<select class="variant" data-item="${idx}">${variantOptions}</select>` : ''}
      <div class="price" id="price-${idx}">£${item.price.toFixed(2)}</div>

      <div class="file-input-wrapper">
        <input type="file" id="photo-${idx}" accept="image/*" data-item="${idx}">
        <button class="upload-btn" onclick="document.getElementById('photo-${idx}').click()">📸 Pick your pic and click</button>
      </div>

      <div class="cartoon-option">
        <label>
          <input type="checkbox" class="cartoon-check" data-item="${idx}">
          <div class="cartoon-text">
            <div class="cartoon-title">✨ Cartoonify My Photo! (+£1.99)</div>
            <div class="cartoon-desc">Get a free preview first — if you love it, we'll print the full-quality cartoon version.</div>
          </div>
        </label>
      </div>

      <div class="preview-container" id="preview-${idx}">
        <img class="preview-img" id="preview-img-${idx}" src="">
        <button class="preview-btn preview-accept" onclick="acceptCartoon(${idx})">✅ Yes, Cartoonify It</button>
        <button class="preview-btn preview-reject" onclick="rejectCartoon(${idx})">❌ Keep Original</button>
      </div>

      <button class="buy-btn" id="buy-btn-${idx}" onclick="startCheckout(${idx})">Buy Now</button>
      <p class="status" id="status-${idx}"></p>
    </div>
  `;

  container.appendChild(card);

  // Variant price update
  if (hasMultipleVariants) {
    card.querySelector(`select[data-item="${idx}"]`).addEventListener('change', (e) => {
      const basePrice = parseFloat(e.target.options[e.target.selectedIndex].dataset.price);
      const cartoonAdd = document.querySelector(`.cartoon-check[data-item="${idx}"]`).checked ? 1.99 : 0;
      document.getElementById(`price-${idx}`).textContent = '£' + (basePrice + cartoonAdd).toFixed(2);
    });
  }

  // Cartoon checkbox
  document.querySelector(`.cartoon-check[data-item="${idx}"]`).addEventListener('change', async (e) => {
    const file = document.getElementById(`photo-${idx}`).files[0];
    if (!file) {
      e.target.checked = false;
      document.getElementById(`status-${idx}`).textContent = "📸 Upload a photo first!";
      return;
    }

    const variantPrice = document.querySelector(`select[data-item="${idx}"]`)?.value ? 
      parseFloat(document.querySelector(`select[data-item="${idx}"]`).options[document.querySelector(`select[data-item="${idx}"]`).selectedIndex].dataset.price) : 
      item.price;

    if (e.target.checked) {
      document.getElementById(`status-${idx}`).textContent = "🎨 Generating free cartoon preview...";
      try {
        const base64 = await toBase64(file);
        const response = await fetch('https://onjjem-production-5ef8.up.railway.app/api/cartoonify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ base64Image: base64, mimeType: file.type, watermark: true })
        });
        const data = await response.json();
        if (data.alreadyUsed) {
          document.getElementById(`status-${idx}`).textContent = "✅ Preview limit reached. Adding £1.99 for cartoon.";
          cartoonPreviewData[idx] = null;
        } else {
          document.getElementById(`preview-img-${idx}`).src = `data:${file.type};base64,${data.base64Image}`;
          document.getElementById(`preview-${idx}`).classList.add('show');
          cartoonPreviewData[idx] = { preview: true, file };
          document.getElementById(`status-${idx}`).textContent = "";
        }
      } catch (err) {
        document.getElementById(`status-${idx}`).textContent = "Error generating preview. Proceeding with blind cartoon.";
        cartoonPreviewData[idx] = { preview: false, file };
      }
      document.getElementById(`price-${idx}`).textContent = '£' + (variantPrice + 1.99).toFixed(2);
    } else {
      document.getElementById(`preview-${idx}`).classList.remove('show');
      document.getElementById(`price-${idx}`).textContent = '£' + variantPrice.toFixed(2);
      document.getElementById(`status-${idx}`).textContent = "";
      cartoonPreviewData[idx] = null;
    }
  });

  // File upload
  document.getElementById(`photo-${idx}`).addEventListener('change', () => {
    if (document.getElementById(`photo-${idx}`).files.length > 0) {
      document.getElementById(`status-${idx}`).textContent = "✅ Photo ready";
    }
  });
});

function acceptCartoon(idx) {
  document.getElementById(`preview-${idx}`).classList.remove('show');
  document.getElementById(`status-${idx}`).textContent = "✅ Cartoon confirmed!";
}

function rejectCartoon(idx) {
  document.querySelector(`.cartoon-check[data-item="${idx}"]`).checked = false;
  document.getElementById(`preview-${idx}`).classList.remove('show');
  cartoonPreviewData[idx] = null;
  const select = document.querySelector(`select[data-item="${idx}"]`);
  const price = select ? parseFloat(select.options[select.selectedIndex].dataset.price) : ITEMS[idx].price;
  document.getElementById(`price-${idx}`).textContent = '£' + price.toFixed(2);
}

async function toBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function startCheckout(idx) {
  const file = document.getElementById(`photo-${idx}`).files[0];
  if (!file) {
    document.getElementById(`status-${idx}`).textContent = "📸 Upload a photo first!";
    return;
  }

  const select = document.querySelector(`select[data-item="${idx}"]`);
  const sku = select?.value || ITEMS[idx].variants[0].sku;
  const addCartoon = document.querySelector(`.cartoon-check[data-item="${idx}"]`).checked;

  document.getElementById(`status-${idx}`).textContent = "Processing...";
  try {
    const base64 = await toBase64(file);
    const response = await fetch('https://onjjem-production-5ef8.up.railway.app/api/stripe/checkout', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        sku,
        photoBase64: base64,
        cartoonify_upgrade: addCartoon,
        successUrl: 'https://onjjem.com/?success=true',
        cancelUrl: 'https://onjjem.com/prints.html'
      })
    });
    const data = await response.json();
    if (data.url) {
      window.location.href = data.url;
    } else {
      document.getElementById(`status-${idx}`).textContent = "Error: " + (data.error || "Unknown error");
    }
  } catch (err) {
    document.getElementById(`status-${idx}`).textContent = "Error processing checkout";
  }
}
  </script>
</body>
</html>
