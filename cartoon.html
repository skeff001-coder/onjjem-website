<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cartoon Your Pic — Free Preview | ONJJEM</title>
<meta name="description" content="Upload your photo and see it transformed into a fun cartoon — completely free to preview, no obligation.">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #0A0804;
    color: #F5EDD8;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    text-align: center;
  }
  .brand {
    font-size: 22px;
    font-weight: 900;
    letter-spacing: 1px;
    color: #F3D078;
    margin-bottom: 6px;
  }
  .headline {
    font-size: 22px;
    font-weight: 800;
    color: #FFFFFF;
    margin: 0 0 24px;
    line-height: 1.3;
    max-width: 380px;
  }
  .upload-btn {
    display: block;
    width: 100%;
    max-width: 340px;
    background: linear-gradient(135deg,#B8892A,#D4B14A,#F3E2BC,#B8892A);
    color: #1A1206;
    font-size: 17px;
    font-weight: 900;
    padding: 20px 16px;
    border-radius: 16px;
    border: none;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(184,137,42,0.4);
    animation: pulseBtn 1.4s ease-in-out infinite;
    line-height: 1.4;
  }
  @keyframes pulseBtn {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.04); }
  }
  .sub-note {
    font-size: 13px;
    color: rgba(245,237,216,0.65);
    margin-top: 16px;
    max-width: 320px;
  }
</style>
</head>
<body>
  <div class="brand">ONJJEM</div>
  <p class="headline">👇 Tap Here to Upload Your Photo &amp; Get Your Free Cartoon Preview 👇</p>
  <button class="upload-btn" onclick="window.location.href='/?cartoon=1'">
    Upload My Photo Now →
  </button>
  <p class="sub-note">Free to preview, no obligation. Love it? Add it to a gift for just £1.99.</p>
</body>
</html>
