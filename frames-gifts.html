<meta name="description" content="Framed photo tiles, gift tags, accessories & more. Free UK shipping.">
<link rel="canonical" href="https://onjjem.com/frames-gifts" />

<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#2a2a2a; color:#fff; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; }
  .header { background:#3a3a3a; padding:1.2rem 1.5rem; border-bottom:2px solid #d4af37; display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; z-index:100; }
  .logo { font-size:1.5rem; font-weight:700; color:#d4af37; text-decoration:none; letter-spacing:2px; }
  .nav { display:flex; gap:1.5rem; }
  .nav a { color:#fff; text-decoration:none; font-weight:500; font-size:0.9rem; }
  .nav a:hover { color:#d4af37; }
  .page-header { text-align:center; padding:2.5rem 1.5rem 1.5rem; }
  .page-header h1 { color:#d4af37; font-size:2rem; margin-bottom:0.5rem; }
  .page-header p { color:#ccc; max-width:600px; margin:0 auto; }
  .products { max-width:1100px; margin:0 auto; padding:1rem 1.5rem 3rem; display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:1.5rem; }
  .card { background:#fff; border-radius:10px; overflow:hidden; }
  .card img { width:100%; height:200px; object-fit:cover; display:block; background:#eee; }
  .card-body { padding:1.2rem; }
  .card h3 { color:#1a1a1a; font-size:1.1rem; margin-bottom:0.3rem; }
  .card .price { color:#b8892a; font-weight:700; margin-bottom:0.6rem; }
  .card .desc { color:#666; font-size:0.85rem; line-height:1.5; margin-bottom:1rem; }
  select.variant { width:100%; padding:0.6rem; border-radius:6px; border:1px solid #ccc; margin-bottom:0.8rem; font-size:0.85rem; }
  input[type=file] { width:100%; font-size:0.8rem; margin-bottom:0.8rem; }
  .buy-btn { display:block; width:100%; background:#d4af37; color:#1a1a1a; font-weight:700; padding:0.8rem; border:none; border-radius:6px; cursor:pointer; }
  .buy-btn:hover { background:#e5c158; }
  .buy-btn:disabled { opacity:0.5; cursor:not-allowed; }
  .status { font-size:0.8rem; margin-top:0.5rem; min-height:14px; text-align:center; }
  footer { text-align:center; padding:2rem; color:#999; border-top:1px solid #444; font-size:0.85rem; }
  footer a { color:#d4af37; text-decoration:none; margin:0 8px; }
</style>
</head>
<body>

<header class="header">
  <a href="/" class="logo">ONJJEM</a>
  <nav class="nav">
    <a href="/">Home</a>
    <a href="/#help">Help</a>
    <a href="/gift-cards.html">Gift Cards</a>
  </nav>
</header>

<div class="page-header">
  <h1>Frames & Gifts</h1>
  <p>Framed photo tiles, gift tags, coasters, magnets & accessories — the perfect finishing touches.</p>
</div>

<div class="products" id="products"></div>

<footer>
  <a href="/delivery.html">Delivery Info</a>
  <a href="/terms.html">Terms</a>
  <a href="/privacy.html">Privacy</a>
</footer>

<script>
const API_BASE = "https://onjjem-production-5ef8.up.railway.app";

const ITEMS = [
  {
    name: "Framed Photo Tiles",
    img: "/products/framed-tile.jpg",
    desc: "Your photo printed on a durable tile, mounted in an elegant frame. Ready to hang. Bathroom-safe, easy to clean.",
    variants: [
      { sku: "tile-frame-6x4", label: "6x4 inch Framed - £12.99" },
      { sku: "tile-frame-8x6", label: "8x6 inch Framed - £18.99" },
      { sku: "tile-frame-10x8", label: "10x8 inch Framed - £24.99" }
    ]
  },
  {
    name: "Gift Tags & More",
    img: "/products/gift-tags.jpg",
    desc: "Beautiful custom gift tags printed with your photo. Perfect for wrapping special presents. Hole for string or ribbon included.",
    variants: [
      { sku: "gift-tags-set-10", label: "Pack of 10 Tags - £8.99" },
      { sku: "gift-tags-set-20", label: "Pack of 20 Tags - £14.99" }
    ]
  },
  {
    name: "Photo Coasters (Wooden)",
    img: "/products/wooden-coasters.jpg",
    desc: "Heat-resistant wooden coaster with cork backing. Photo printed on top. Practical, personal, and gets used every day.",
    variants: [
      { sku: "coaster-2pk", label: "Set of 2 - £11.99" },
      { sku: "coaster-4pk", label: "Set of 4 - £16.99" }
    ]
  },
  {
    name: "Photo Magnets",
    img: "/products/photo-magnets.webp",
    desc: "High-gloss magnetic stock in multiple shapes. Mix and match to create your fridge gallery.",
    variants: [
      { sku: "magnet-fridge-3x2", label: "Fridge Magnet 3x2 - £8.99" },
      { sku: "magnet-fridge-6x4", label: "Fridge Magnet 6x4 - £9.99" },
      { sku: "magnet-acrylic-2x3", label: "Acrylic Magnet 2x3 - £12.99" },
      { sku: "magnet-square-4x4", label: "Square Magnet 4x4 - £11.99" },
      { sku: "magnet-square-6x6", label: "Square Magnet 6x6 - £17.99" }
    ]
  },
  {
    name: "Personalised Patch (Iron-On)",
    img: "/products/patch.jpg",
    desc: "Custom iron-on patch with your photo. Stick it on a bag, jacket, or cushion cover. Heat-transfer adhesive.",
    variants: [
      { sku: "patch-3x3", label: "3x3 inch - £7.99" },
      { sku: "patch-4x4", label: "4x4 inch - £11.99" }
    ]
  },
  {
    name: "Photo Tattoos (Temporary)",
    img: "/products/tattoos.jpg",
    desc: "Temporary photo tattoos featuring your image. Fun, harmless, and great for festivals or parties.",
    variants: [
      { sku: "tattoo-sheet-5", label: "Sheet of 5 - £5.99" },
      { sku: "tattoo-sheet-10", label: "Sheet of 10 - £9.99" }
    ]
  },
  {
    name: "Custom Photo Socks",
    img: "/products/socks.jpg",
    desc: "Cosy crew socks with your photo printed all over. Available in multiple colours. Unisex fit.",
    variants: [
      { sku: "socks-onesize", label: "One Size Socks - £14.99" }
    ]
  },
  {
    name: "Gift Cards (Digital & Physical)",
    img: "/products/gift-card.jpg",
    desc: "Let them choose their perfect personalised gift. Available from £20 up to £100. Digital delivery or physical card.",
    variants: [
      { sku: "gift-card-20", label: "£20 Gift Card" },
      { sku: "gift-card-50", label: "£50 Gift Card" },
      { sku: "gift-card-100", label: "£100 Gift Card" }
    ]
  }
];

const grid = document.getElementById("products");
window.__items = {};

ITEMS.forEach((item, i) => {
  window.__items[i] = item;
  const showDropdown = item.variants.length > 1;
  const options = item.variants.map(v => `<option value="${v.sku}">${v.label}</option>`).join("");
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `
    <img src="${item.img}" alt="${item.name}" loading="lazy">
    <div class="card-body">
      <h3>${item.name}</h3>
      ${showDropdown ? `<select class="variant" data-item="${i}">${options}</select>` : `<p class="price">${item.variants[0].label}</p>`}
      <p class="desc">${item.desc}</p>
      ${item.name !== "Gift Cards (Digital & Physical)" ? `<input type="file" accept="image/*" data-item="${i}">` : ''}
      <button class="buy-btn" data-item="${i}" ${item.name === "Gift Cards (Digital & Physical)" ? '' : 'disabled'}>📸 Add Your Photo</button>
      <p class="status" data-status="${i}"></p>
    </div>
  `;
  grid.appendChild(card);
});

document.querySelectorAll('input[type="file"]').forEach(input => {
  input.addEventListener("change", () => {
    const i = input.dataset.item;
    const btn = document.querySelector(`.buy-btn[data-item="${i}"]`);
    const status = document.querySelector(`[data-status="${i}"]`);
    if (input.files.length > 0) {
      btn.disabled = false;
      btn.textContent = "Buy Now";
      status.textContent = "✅ Photo added";
      status.style.color = "#2e7d32";
    }
  });
});

function toBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

document.querySelectorAll(".buy-btn").forEach(btn => {
  btn.addEventListener("click", async () => {
    const i = btn.dataset.item;
    const item = window.__items[i];
    const select = document.querySelector(`select[data-item="${i}"]`);
    const sku = select ? select.value : item.variants[0].sku;
    
    // Gift cards don't need photos
    if (item.name === "Gift Cards (Digital & Physical)") {
      btn.disabled = true;
      const status = document.querySelector(`[data-status="${i}"]`);
      status.textContent = "Preparing checkout...";
      
      try {
        const res = await fetch(`${API_BASE}/api/stripe/checkout`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            sku,
            successUrl: window.location.origin + "/?order=success&session_id={CHECKOUT_SESSION_ID}",
            cancelUrl: window.location.href
          })
        });
        const data = await res.json();
        if (data.url) window.location.href = data.url;
        else { status.textContent = data.error || "Something went wrong"; btn.disabled = false; }
      } catch (err) {
        status.textContent = "Could not connect. Please try again.";
        btn.disabled = false;
      }
      return;
    }
    
    const fileInput = document.querySelector(`input[type="file"][data-item="${i}"]`);
    const status = document.querySelector(`[data-status="${i}"]`);
    const file = fileInput.files[0];
    if (!file) { status.textContent = "Please choose a photo first"; return; }

    btn.disabled = true;
    status.textContent = "Preparing checkout...";

    try {
      const photoBase64 = await toBase64(file);
      const res = await fetch(`${API_BASE}/api/stripe/checkout`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          sku,
          photoBase64,
          successUrl: window.location.origin + "/?order=success&session_id={CHECKOUT_SESSION_ID}",
          cancelUrl: window.location.href
        })
      });
      const data = await res.json();
      if (data.url) window.location.href = data.url;
      else { status.textContent = data.error || "Something went wrong"; btn.disabled = false; }
    } catch (err) {
      status.textContent = "Could not connect. Please try again.";
      btn.disabled = false;
    }
  });
});
</script>
</body>
</html>
