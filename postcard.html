<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo Postcard — Launch Price £2.99 | ONJJEM</title>
<meta name="description" content="Upload your photo and get a real, printed postcard delivered to your door — launch price £2.99, free UK shipping.">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #0A0804;
    color: #F5EDD8;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding-bottom: 100px;
  }
  .urgency-banner {
    background: linear-gradient(90deg, #E8384F, #D4A843);
    color: #FFFFFF;
    text-align: center;
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 8px 10px;
    animation: pulseBanner 1.4s ease-in-out infinite;
  }
  @keyframes pulseBanner {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.7; }
  }
  .wrap { max-width: 420px; margin: 0 auto; padding: 20px 16px; }
  .brand { text-align: center; font-size: 18px; font-weight: 900; color: #F3D078; letter-spacing: 1px; margin-bottom: 4px; }
  h1 { text-align: center; font-size: 22px; font-weight: 800; color: #FFFFFF; margin: 4px 0 4px; }
  .sub { text-align: center; color: rgba(245,237,216,0.65); font-size: 13px; margin-bottom: 20px; }

  .upload-box {
    background: rgba(184,137,42,0.08);
    border: 2px dashed rgba(184,137,42,0.4);
    border-radius: 16px;
    padding: 32px 16px;
    text-align: center;
    cursor: pointer;
    margin-bottom: 20px;
  }
  .upload-box svg { width: 40px; height: 40px; margin-bottom: 8px; color: #D4B14A; }
  .upload-box .main-text { font-size: 15px; font-weight: 800; color: #F3E9D6; }
  .upload-box .sub-text { font-size: 12px; color: rgba(245,237,216,0.5); margin-top: 4px; }
  #photoInput { display: none; }

  .price-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-top: 1px solid rgba(184,137,42,0.2);
    border-bottom: 1px solid rgba(184,137,42,0.2);
    padding: 14px 0;
    margin-bottom: 20px;
  }
  .price-now { font-size: 28px; font-weight: 900; color: #FFFFFF; }
  .free-ship-pill {
    background: rgba(57,255,136,0.15);
    color: #39FF88;
    font-size: 11px;
    font-weight: 800;
    text-transform: uppercase;
    padding: 5px 10px;
    border-radius: 20px;
  }

  .cartoon-box {
    border: 2px dashed #8E24AA;
    background: rgba(142,36,170,0.1);
    border-radius: 16px;
    padding: 14px;
    margin-bottom: 20px;
  }
  .cartoon-box label { display: flex; align-items: flex-start; gap: 10px; cursor: pointer; }
  .cartoon-box input[type="checkbox"] { width: 20px; height: 20px; margin-top: 2px; flex-shrink: 0; }
  .cartoon-title { font-weight: 900; color: #F3D078; font-size: 15px; }
  .cartoon-desc { font-size: 12.5px; color: rgba(245,237,216,0.7); margin-top: 4px; line-height: 1.5; }

  .status { font-size: 13px; text-align: center; min-height: 18px; margin-top: 6px; }

  .sticky-btn-wrap {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: #0A0804;
    border-top: 1px solid rgba(184,137,42,0.3);
    padding: 14px 16px;
    max-width: 420px;
    margin: 0 auto;
  }
  .buy-btn {
    width: 100%;
    background: linear-gradient(135deg,#B8892A,#D4B14A,#F3E2BC,#B8892A);
    color: #1A1206;
    font-size: 17px;
    font-weight: 900;
    padding: 16px;
    border-radius: 14px;
    border: none;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }
  .buy-btn:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>

  <div class="urgency-banner">⏳ Launch Price — Limited Time Only!</div>

  <div class="wrap">
    <div class="brand">ONJJEM</div>
    <h1>Photo Postcard</h1>
    <p class="sub">From your camera roll to your doorstep</p>

    <div class="upload-box" id="uploadBox" onclick="document.getElementById('photoInput').click()">
      <svg id="uploadIcon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 002-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
      <img id="photoPreview" style="display:none; max-width:100%; max-height:220px; border-radius:12px; margin-bottom:8px;" alt="Your uploaded photo">
      <div class="main-text" id="uploadMainText">Tap to Upload Your Photo</div>
      <div class="sub-text" id="uploadSubText">Accepts JPG or PNG from your camera roll</div>
    </div>
    <input type="file" id="photoInput" accept="image/*">
    <p class="status" id="fileStatus"></p>

    <div class="price-row">
      <div class="price-now">£2.99</div>
      <span class="free-ship-pill">Free UK Shipping</span>
    </div>

    <div class="cartoon-box">
      <label>
        <input type="checkbox" id="cartoonCheckbox">
        <div>
          <div class="cartoon-title">✨ Cartoonify My Photo! (+£1.99)</div>
          <div class="cartoon-desc">See a free preview first — if you love it, we'll print the full-quality cartoon version onto your postcard instead of the plain photo.</div>
        </div>
      </label>
    </div>

    <p class="status" id="checkoutStatus"></p>
    <div id="previewWrap" style="display:none; margin-bottom:20px; text-align:center;">
      <img id="previewImg" style="max-width:100%; border-radius:14px; box-shadow:0 4px 16px rgba(0,0,0,0.4);" alt="Your cartoon preview">
    </div>
  </div>

  <div class="sticky-btn-wrap">
    <button class="buy-btn" id="buyBtn" disabled onclick="startCheckout()">Secure My Custom Card 🚀</button>
  </div>

<script>
const API_BASE = "https://onjjem-production-5ef8.up.railway.app";
let photoBase64 = null;

function toBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

document.getElementById("photoInput").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  const fileStatus = document.getElementById("fileStatus");
  const buyBtn = document.getElementById("buyBtn");
  if (!file) return;
  fileStatus.textContent = "Loading your photo...";
  try {
    photoBase64 = await toBase64(file);
    document.getElementById("photoPreview").src = photoBase64;
    document.getElementById("photoPreview").style.display = "block";
    document.getElementById("uploadIcon").style.display = "none";
    document.getElementById("uploadMainText").textContent = "✅ Photo added — tap to change";
    document.getElementById("uploadSubText").textContent = file.name;
    fileStatus.textContent = "";
    buyBtn.disabled = false;
  } catch (err) {
    fileStatus.textContent = "Could not read that photo. Please try again.";
  }
});

let confirmedCartoonBase64 = null;

document.getElementById("cartoonCheckbox").addEventListener("change", async (e) => {
  const status = document.getElementById("checkoutStatus");
  if (!e.target.checked) {
    confirmedCartoonBase64 = null;
    status.textContent = "";
    return;
  }
  if (!photoBase64) {
    status.textContent = "Please upload a photo first.";
    e.target.checked = false;
    return;
  }
  status.textContent = "Generating your free cartoon preview...";
  try {
    const mimeMatch = photoBase64.match(/^data:([^;]+);/);
    const mimeType = mimeMatch ? mimeMatch[1] : "image/jpeg";
    const res = await fetch(`${API_BASE}/api/cartoonify`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ base64Image: photoBase64, mimeType, watermark: true }),
    });
    const data = await res.json();
    if (data.alreadyUsed) {
      status.textContent = "You've used your free preview — the cartoon will still be added at checkout.";
      confirmedCartoonBase64 = "PENDING"; // regenerate fresh at checkout time instead
      return;
    }
    if (!res.ok || !data.base64Image) {
      throw new Error(data.error || "Could not generate preview");
    }
    document.getElementById("previewImg").src = `data:${data.mimeType};base64,${data.base64Image}`;
    document.getElementById("previewWrap").style.display = "block";
    status.textContent = "✅ Here's your free preview! Love it? Tap below to order.";
  } catch (err) {
    status.textContent = "Couldn't generate a preview — the cartoon will still be added at checkout.";
    confirmedCartoonBase64 = "PENDING";
  }
});

async function startCheckout() {
  const buyBtn = document.getElementById("buyBtn");
  const status = document.getElementById("checkoutStatus");
  const addCartoon = document.getElementById("cartoonCheckbox").checked;

  if (!photoBase64) {
    status.textContent = "Please upload a photo first.";
    return;
  }

  buyBtn.disabled = true;
  status.textContent = "Preparing checkout...";

  try {
    const res = await fetch(`${API_BASE}/api/stripe/checkout`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        sku: "CLASSIC-POST-GLOS-6X4",
        photoBase64,
        successUrl: window.location.origin + "/?order=success",
        cancelUrl: window.location.href,
        ...(addCartoon ? { addCartoon: true } : {}),
      }),
    });
    const data = await res.json();
    if (data.url) {
      window.location.href = data.url;
    } else {
      throw new Error(data.error || "Could not start checkout");
    }
  } catch (err) {
    status.textContent = "Something went wrong — please try again.";
    buyBtn.disabled = false;
  }
}
</script>
</body>
</html>
